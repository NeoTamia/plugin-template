# Files copied from this template into repositories created from it.
# Nested templates keep extra keys/files; after their sync PR is merged
# they fan out to their own generated repos.

discover: true
skip_archived: true
prefer_branch: dev

include_repos:
exclude_repos:

identity:
  extra:
    re.neotamia.plugintemplate: re.{owner_slug}.{slug}
    plugintemplate-build: "{slug}-build"
  owner_files:
    - README.md
    - CONTRIBUTING.md
    - settings.gradle.kts
    - buildSrc/src/main/kotlin/*-build.gradle.kts

overwrite:
  - .editorconfig
  - .github/renovate.json5
  - .github/workflows/build.yml
  - .github/workflows/lint.yml
  - .github/workflows/test.yml
  - .github/workflows/release-please.yml
  - .github/workflows/template-sync.yml
  - .github/ISSUE_TEMPLATE/**
  - .github/PULL_REQUEST_TEMPLATE.md
  - gradle/wrapper/**
  - buildSrc/build.gradle.kts
  - buildSrc/settings.gradle.kts
  - settings.gradle.kts
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md

merge_toml:
  - gradle/libs.versions.toml

three_way:
  - buildSrc/src/main/kotlin/*-build.gradle.kts
  - gradle.properties
  - AGENTS.md
  - .github/template-sync.yml

exclude:
  - .github/workflows/project-setup.yml
  - .github/template-sync-state.json
  - modules/**
  - README.md
