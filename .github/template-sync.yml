# Copied into generated plugin repos. They pull this template with GITHUB_TOKEN.

source:
source_ref:
prefer_branch: dev

identity:
  extra:
    re.neotamia.plugintemplate: re.{owner_slug}.{slug}
    plugintemplate-build: "{slug}-build"
  owner_files:
    - README.md
    - CONTRIBUTING.md
    - settings.gradle.kts
    - buildSrc/src/main/kotlin/*-build.gradle.kts

overwrite:

merge_toml:
  - gradle/libs.versions.toml

three_way:
  - .editorconfig
  - .github/renovate.json5
  - .github/ISSUE_TEMPLATE/**
  - .github/PULL_REQUEST_TEMPLATE.md
  - gradle/wrapper/**
  - buildSrc/build.gradle.kts
  - buildSrc/settings.gradle.kts
  - buildSrc/src/main/kotlin/*-build.gradle.kts
  - settings.gradle.kts
  - gradle.properties
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - AGENTS.md
  - .github/template-sync.yml

exclude:
  - .github/workflows/**
  - .github/template-sync-state.json
  - modules/**
  - README.md
